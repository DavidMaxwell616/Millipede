<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phaser 3 Spritesheet Color Swap</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div id="game-container"></div>

    <script>
        function swapSpritesheetColors(scene, sourceKey, newKey, colorMap) {
            const texture = scene.textures.get(sourceKey);
            if (!texture) {
                console.warn(`Texture "${sourceKey}" not found`);
                return null;
            }

            const sourceImage = texture.getSourceImage();
            if (!sourceImage) {
                console.warn(`Source image for "${sourceKey}" not found`);
                return null;
            }

            const canvas = document.createElement('canvas');
            canvas.width = sourceImage.width;
            canvas.height = sourceImage.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(sourceImage, 0, 0);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const a = data[i + 3];

                if (a === 0) continue;

                for (const map of colorMap) {
                    const [oldR, oldG, oldB] = map.old;
                    if (r === oldR && g === oldG && b === oldB) {
                        data[i] = map.new[0];
                        data[i + 1] = map.new[1];
                        data[i + 2] = map.new[2];
                        break;
                    }
                }
            }

            ctx.putImageData(imageData, 0, 0);

            const canvasTexture = scene.textures.createCanvas(newKey, canvas.width, canvas.height);
            canvasTexture.context.drawImage(canvas, 0, 0);
            canvasTexture.update();

            Object.keys(texture.frames).forEach(frameName => {
                if (frameName === '__BASE') return;
                const origFrame = texture.frames[frameName];
                canvasTexture.add(frameName, 0, origFrame.x, origFrame.y, origFrame.width, origFrame.height);
            });

            return canvasTexture;
        }

        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            pixelArt: true,
            scene: {
                preload: preload,
                create: create
            }
        };

        const game = new Phaser.Game(config);

        function preload() {
            this.load.spritesheet('centipede-head-sprites', '../assets/images/centipede_head_spritesheet.png', {
                frameWidth: 8,
                frameHeight: 8,
                endFrame: 7
            });
        }

        function create() {
            const centipedeColorMap = [
                { old: [255, 255, 255], new: [0, 255, 200] },
                { old: [255, 0, 0], new: [255, 0, 200] },
                { old: [0, 255, 0], new: [0, 200, 255] }
            ];

            swapSpritesheetColors(this, 'centipede-head-sprites', 'centipede-head-sprites-variant', centipedeColorMap);

            this.anims.create({
                key: 'crawl_original',
                frames: this.anims.generateFrameNumbers('centipede-head-sprites', { start: 0, end: 3 }),
                frameRate: 8,
                repeat: -1
            });

            this.anims.create({
                key: 'crawl_variant',
                frames: this.anims.generateFrameNumbers('centipede-head-sprites-variant', { start: 0, end: 3 }),
                frameRate: 8,
                repeat: -1
            });

            const originalCentipede = this.add.sprite(300, 300, 'centipede-head-sprites').setScale(3);
            originalCentipede.play('crawl_original');

            const variantCentipede = this.add.sprite(500, 300, 'centipede-head-sprites-variant').setScale(3);
            variantCentipede.play('crawl_variant');
        }
    </script>
</body>

</html>
